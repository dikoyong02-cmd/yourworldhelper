<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>창작 도우미</title>
  <style>
    :root {
      --accent-color: #4A90E2;
    }
    body {
      font-family: sans-serif;
      padding: 20px;
      line-height: 1.6;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
    }
    #resultOutput {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      min-height: 100px;
    }
  </style>
  <!-- Marked.js (마크다운 파싱용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <h1>웹소설 창작 도우미</h1>

  <div class="input-group">
    <label for="genreSelect">장르</label>
    <select id="genreSelect">
      <option value="판타지">판타지</option>
      <option value="현대판타지">현대판타지</option>
      <option value="무협">무협</option>
      <option value="로맨스">로맨스</option>
      <option value="SF">SF</option>
    </select>
  </div>

  <div class="input-group">
    <label for="languageSelect">출력 언어</label>
    <select id="languageSelect">
      <option value="한국어" selected>한국어</option>
      <option value="영어">영어</option>
      <option value="일본어">일본어</option>
    </select>
  </div>

  <div class="input-group">
    <label for="promptInput">세계관 설정 / 요구사항</label>
    <textarea id="promptInput" rows="4" placeholder="세계관 설정을 입력하세요."></textarea>
  </div>

  <div class="input-group">
    <label for="keywordInput">상황 서술 / 핵심 키워드</label>
    <input type="text" id="keywordInput" placeholder="상황이나 키워드를 입력하세요.">
  </div>

  <button id="btnSubmit" onclick="generateContent()">[ 생성 실행 ]</button>

  <div id="resultOutput">
    <p>결과가 여기에 표시됩니다.</p>
  </div>

  <script>
    // 상태 변수 예시
    let currentMainTab = 'topic'; // 'topic' 또는 'myWorld'
    let currentSubTab = 'world';  // 'world', 'character', 'plot'
    let rawMarkdownResult = '';

    // 토스트 메시지 출력 함수 (임시)
    function showToast(message) {
      alert(message);
    }

    // 히스토리 저장 함수 (임시)
    function saveToHistory(type, content) {
      console.log(`[히스토리 저장] ${type}:`, content);
    }

    // 출력 텍스트 정제 함수
    function cleanOutputText(text) {
      return text.trim();
    }

    // 수정된 generateContent 함수
    async function generateContent() {
      const promptInput = document.getElementById('promptInput');
      const keywordInput = document.getElementById('keywordInput');
      const submitBtn = document.getElementById('btnSubmit');

      let rawPrompt = promptInput ? promptInput.value.trim() : "";
      let rawKeyword = keywordInput ? keywordInput.value.trim() : "";
      const targetLanguage = document.getElementById('languageSelect')?.value || "한국어";
      const genre = document.getElementById('genreSelect')?.value || "판타지";
      const outputDiv = document.getElementById('resultOutput');

      const invalidValues = ['', '없음', '아무거나', '아무꺼나', 'none', 'null', 'undefined', '없음.', '아무거나.'];
      
      let processedPrompt = invalidValues.includes(rawPrompt.toLowerCase()) 
        ? `사용자가 자유롭게 설정 가능한 창작 세계관` 
        : rawPrompt;

      let processedKeyword = invalidValues.includes(rawKeyword.toLowerCase()) 
        ? `용돈받고 먹는 라면은 맛있다` 
        : rawKeyword;

      if (!processedPrompt && !processedKeyword) {
        processedPrompt = `사용자가 자유롭게 설정 가능한 창작 세계관`;
        processedKeyword = `용돈받고 먹는 라면은 맛있다`;
      }

      const MAX_INPUT_LEN = 4000;
      if (processedPrompt.length > MAX_INPUT_LEN) {
        processedPrompt = processedPrompt.substring(0, MAX_INPUT_LEN);
        showToast("입력문이 너무 길어 상위 4000자까지 축소되어 처리됩니다.");
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "[ 생성 처리 중... ]";
      }
      if (outputDiv) {
        outputDiv.innerHTML = '<p style="color:var(--accent-color);">AI가 키워드와 상황을 분석하여 생성 중입니다...</p>';
      }

      const systemRules = `[시스템 지시사항]
1. 답변은 반드시 완벽하고 자연스러운 ${targetLanguage}로만 작성해야 합니다.
2. 타 언어(영어, 기타 외국어)나 개발 코드, 특수 키워드(예: _EXTENSIONS 등)를 절대로 출력에 포함하지 마세요.
3. 무관한 외부 설정(예: 공립, 위기 등)을 임의로 추가하지 마세요.
4. 순수 완성본 결과물만 깔끔하게 출력하세요.`;

      let userPromptMessage = `${systemRules}\n\n`;

      if (currentMainTab === 'topic') {
        userPromptMessage += `[주제 선정 - 키워드 및 세계관 규칙]
- 세계관 설정: ${processedPrompt}
- 입력된 상황 서술: "${processedKeyword}"

[엄격한 단어 수 규칙 및 가이드라인]
1. **단어 구성 규칙 (반드시 준수)**:
   - 각 단어 세트는 **정확히 총 4개의 단어**로만 이루어져야 합니다.
   - 4개의 단어는 **[상황 서술에서 추출한 핵심 단어 2개] + [세계관 설정에서 추출한 핵심 단어 2개]**로 엄격히 구성하세요.
   - 무관한 외부 단어(예: 공립, 위기 등)나 영어를 절대 섞지 마세요.

   *(예시: 상황 서술이 "용돈받고 먹는 라면은 맛있다"인 경우 -> 상황 단어 2개는 "용돈", "라면")*

2. **단어 세트 생성 (총 3세트)**:
   - 단어 세트 1: "상황단어1", "상황단어2", "세계관단어1", "세계관단어2"
   - 단어 세트 2: "상황단어1", "상황단어2", "세계관단어3", "세계관단어4"
   - 단어 세트 3: "상황단어1", "상황단어2", "세계관단어5", "세계관단어6"

3. **상황형 문장 생성**:
   - 각 단어 세트에 속한 4개의 단어를 모두 자연스럽게 조합하여 한 문장씩 총 3개의 문장을 작성하세요.

[출력 양식 예시]

[ 단어형 주제 ]

* 단어 세트 1: "용돈", "라면", "(세계관단어1)", "(세계관단어2)"
* 단어 세트 2: "용돈", "라면", "(세계관단어3)", "(세계관단어4)"
* 단어 세트 3: "용돈", "라면", "(세계관단어5)", "(세계관단어6)"

[ 상황형 주제 ]

* 문장 1: (단어 세트 1의 4개 단어를 조합한 매끄러운 한 문장)
* 문장 2: (단어 세트 2의 4개 단어를 조합한 매끄러운 한 문장)
* 문장 3: (단어 세트 3의 4개 단어를 조합한 매끄러운 한 문장)`;
      } else if (currentMainTab === 'myWorld') {
        if (currentSubTab === 'world') {
          userPromptMessage += `[세계관 구상 - 초보자 모드]\n- 장르: ${genre}\n- 요구사항: ${processedPrompt}\n- 핵심 키워드/상황: "${processedKeyword}"\n\n[작성 요구사항]\n"${processedKeyword}" 상황의 테마와 핵심 단어들을 자연스럽게 세계관 속에 녹여내어, 지리/사회 구조/규칙이 포함된 완성형 세계관 문서를 작성하세요.`;
        } else if (currentSubTab === 'character') {
          userPromptMessage += `[캐릭터 구상 - 초보자 모드]\n- 장르: ${genre}\n- 요구사항: ${processedPrompt}\n- 핵심 키워드/상황: "${processedKeyword}"\n\n[작성 요구사항]\n"${processedKeyword}" 상황과 관련된 캐릭터 프로필(외형, 성격, 배경, 동기)을 작성하세요.`;
        } else if (currentSubTab === 'plot') {
          userPromptMessage += `[플롯 구상 - 초보자 모드]\n- 장르: ${genre}\n- 사건 요약: ${processedPrompt}\n- 핵심 키워드/상황: "${processedKeyword}"\n\n[작성 요구사항]\n"${processedKeyword}" 상황을 중심으로 기승전결 사건 흐름과 복선을 포함한 스토리 플롯을 작성하세요.`;
        }
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 60000);

      try {
        const response = await fetch('/generate', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            prompt: userPromptMessage
          })
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          let errMessage = `서버 응답 오류 (코드: ${response.status})`;
          try {
            const errData = await response.json();
            if (errData.error) errMessage = errData.error;
          } catch(e) {}
          throw new Error(errMessage);
        }

        const data = await response.json();
        
        if (!data.result) {
          throw new Error("서버에서 빈 결과가 반환되었습니다.");
        }

        rawMarkdownResult = cleanOutputText(data.result);
        if (outputDiv) {
          outputDiv.innerHTML = window.marked ? marked.parse(rawMarkdownResult) : rawMarkdownResult;
        }

        const typeTag = currentMainTab === 'topic' ? '주제' : currentSubTab;
        saveToHistory(typeTag, rawMarkdownResult);

      } catch (error) {
        console.error("오류 상세 내용:", error);
        let showErrMsg = error.message;
        if (error.name === 'AbortError') {
          showErrMsg = "서버 응답 시간이 초과되었습니다 (60초 타임아웃). 입력 내용을 조금 줄여서 다시 시도해보세요.";
        }
        if (outputDiv) {
          outputDiv.innerHTML = `<p style="color:red; font-weight:bold;">생성 실패:</p><p style="color:red;">${showErrMsg}</p>`;
        }
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = "[ 생성 실행 ]";
        }
      }
    }
  </script>
</body>
</html>
