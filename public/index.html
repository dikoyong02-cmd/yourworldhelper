<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your World Helper - Y2K Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #008080;
      --card-bg: #c0c0c0;
      --card-sub-bg: #d4d0c8;
      --text-color: #000000;
      --border-color: #000000;
      --accent-color: #000080;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #000080;
      --footer-text: #404040;
      
      --canvas-bg: #004d4d;
      --canvas-grid: rgba(255, 255, 255, 0.1);
      --canvas-frame: #000080;
    }

    [data-theme="classic"] {
      --bg-color: #008080;
      --card-bg: #c0c0c0;
      --card-sub-bg: #d4d0c8;
      --text-color: #000000;
      --border-color: #000000;
      --accent-color: #000080;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #000080;
      --canvas-bg: #0b3c3c;
      --canvas-grid: rgba(255, 255, 255, 0.12);
      --canvas-frame: #000080;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --card-bg: #2d2d2d;
      --card-sub-bg: #3a3a3a;
      --text-color: #5cdb95;
      --border-color: #5cdb95;
      --accent-color: #d63484;
      --accent-text: #ffffff;
      --input-bg: #121212;
      --window-title-bg: #d63484;
      --canvas-bg: #121212;
      --canvas-grid: rgba(92, 219, 149, 0.15);
      --canvas-frame: #d63484;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', 'Dotum', '굴림', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      touch-action: manipulation;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      padding: 10px;
      box-shadow: 4px 4px 0px #000000;
    }

    header {
      background: var(--window-title-bg);
      padding: 6px 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
    }

    .theme-selector-box {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 11px;
    }

    .theme-selector-box select {
      padding: 3px 6px;
      font-size: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
    }

    .tab-btn, .sub-tab-btn, button.primary-btn, .profile-btn, .board-tool-btn, .side-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .tab-btn.active, .sub-tab-btn.active, .board-tool-btn.active, .side-nav-btn.active {
      background: var(--accent-color);
      color: var(--accent-text);
    }

    .btn-danger {
      background: #c00000 !important;
      color: #ffffff !important;
    }

    .btn-danger:active {
      background: #800000 !important;
    }

    .side-nav-btn {
      width: 100%;
      height: 40px;
      font-size: 12px;
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    .tab-container {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .sub-tab-container {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border-color);
      background: var(--card-sub-bg);
      padding: 12px;
    }

    .card-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
      background: var(--accent-color);
      color: var(--accent-text);
      padding: 4px 8px;
      border: 1px solid var(--border-color);
    }

    .board-container {
      position: relative;
      width: 100%;
      height: 480px;
      background-color: var(--canvas-bg);
      background-image: 
        linear-gradient(var(--canvas-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--canvas-grid) 1px, transparent 1px);
      background-size: 20px 20px;
      border: 2px solid var(--canvas-frame);
      overflow: hidden;
      touch-action: none;
    }

    .board-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 6px;
      border: 1px solid var(--border-color);
    }

    .board-tool-group {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .node-card {
      position: absolute;
      background: var(--card-sub-bg);
      border: 1px solid var(--border-color);
      padding: 6px;
      width: 160px;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
      cursor: move;
      z-index: 20;
      touch-action: none;
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border-color);
    }

    .node-header input {
      font-weight: bold;
      font-size: 11px;
      padding: 2px;
      border: none;
      background: transparent;
      width: 120px;
    }

    .node-close-btn {
      background: #ff4d4d;
      color: white;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      line-height: 16px;
      text-align: center;
      z-index: 30;
    }

    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--border-color);
      padding: 6px;
      font-size: 12px;
      background: var(--input-bg);
      color: var(--text-color);
    }

    sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    footer {
      margin-top: 15px;
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      text-align: center;
      font-size: 11px;
      color: var(--footer-text);
    }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-theme="classic">

<div class="container">
  <header>
    <h1>YOUR WORLD HELPER (v2.0)</h1>
    <div class="theme-selector-box">
      <label for="themeSelect">COLOR THEME:</label>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="classic">Classic Teal</option>
        <option value="dark">Dark Matrix</option>
      </select>
    </div>
  </header>

  <div class="tab-container">
    <button class="tab-btn active" id="myWorldBtn" onclick="selectMainTab('myWorld', this)">나만의 세상 만들기</button>
    <button class="tab-btn" onclick="selectMainTab('topic', this)">주제 선정</button>
    <button class="tab-btn" onclick="selectMainTab('plot', this)">플롯/스토리</button>
