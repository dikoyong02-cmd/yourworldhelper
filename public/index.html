<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스토리 창작 보조 도구</title>
  <!-- Markdown 파싱용 라이브러리 (Marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --card-bg: #2a2a2a;
      --text-color: #e0e0e0;
      --accent-color: #4da6ff;
      --border-color: #444;
      --btn-hover: #3582d4;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .tab-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 4px;
    }

    .tab-btn.active {
      color: #fff;
      background-color: var(--accent-color);
    }

    .sub-tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .sub-tab-btn {
      background-color: #333;
      border: 1px solid var(--border-color);
      color: #ccc;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .sub-tab-btn.active {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input[type="text"], textarea, select {
      background-color: #1E1E1E;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-submit {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--btn-hover);
    }

    .btn-submit:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    #resultOutput {
      line-height: 1.6;
      min-height: 150px;
    }

    #resultOutput ul {
      padding-left: 20px;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      display: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 메인 설정 및 입력 영역 -->
  <div class="card">
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchMainTab('topic')">주제 선정 (창작자 모드)</button>
      <button class="tab-btn" onclick="switchMainTab('myWorld')">내 세계관 (초보자 모드)</button>
    </div>

    <!-- 서브 탭 (내 세계관 클릭 시 표시) -->
    <div id="subTabContainer" class="sub-tab-group" style="display: none;">
      <button class="sub-tab-btn active" onclick="switchSubTab('world')">세계관</button>
      <button class="sub-tab-btn" onclick="switchSubTab('character')">캐릭터</button>
      <button class="sub-tab-btn" onclick="switchSubTab('plot')">플롯</button>
    </div>

    <div class="input-group">
      <label for="languageSelect">출력 언어</label>
      <select id="languageSelect">
        <option value="한국어" selected>한국어</option>
        <option value="English">English</option>
        <option value="日本語">日本語</option>
      </select>

      <div id="genreContainer" style="display: none;">
        <label for="genreSelect">장르 선택</label>
        <select id="genreSelect">
          <option value="판타지">판타지</option>
          <option value="SF">SF</option>
          <option value="현대 로맨스">현대 로맨스</option>
          <option value="미스터리/스릴러">미스터리/스릴러</option>
          <option value="무협">무협</option>
        </select>
      </div>

      <label for="promptInput" id="labelPrompt">세계관 및 배경 상황 설정</label>
      <textarea id="promptInput" placeholder="창작하고 계신 세계관이나 연출하고 싶은 상황을 작성하세요."></textarea>

      <label for="keywordInput">핵심 키워드</label>
      <input type="text" id="keywordInput" placeholder="예: 구원, 배신, 비 오는 날 (쉼표로 구분)">
    </div>

    <button id="btnSubmit" class="btn-submit" onclick="generateContent()">[ 생성 실행 ]</button>
  </div>

  <!-- 결과 출력 영역 -->
  <div class="card">
    <h3>생성 결과</h3>
    <div id="resultOutput">
      <p style="color: #666;">설정을 입력한 후 [ 생성 실행 ] 버튼을 누르세요.</p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let currentMainTab = 'topic';
  let currentSubTab = 'world';
  let rawMarkdownResult = '';

  function switchMainTab(tab) {
    currentMainTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    const subTabContainer = document.getElementById('subTabContainer');
    const genreContainer = document.getElementById('genreContainer');
    const labelPrompt = document.getElementById('labelPrompt');

    if (tab === 'topic') {
      event.target.classList.add('active');
      subTabContainer.style.display = 'none';
      genreContainer.style.display = 'none';
      labelPrompt.innerText = '세계관 및 배경 상황 설정';
    } else {
      event.target.classList.add('active');
      subTabContainer.style.display = 'flex';
      genreContainer.style.display = 'block';
      labelPrompt.innerText = '세부 요구사항 및 설명';
    }
  }

  function switchSubTab(subTab) {
    currentSubTab = subTab;
    document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  function cleanOutputText(text) {
    return text.replace(/_EXTENSIONS/g, '').trim();
  }

  function saveToHistory(type, content) {
    console.log(`[히스토리 저장] ${type}:`, content.substring(0, 30) + "...");
  }

  async function generateContent() {
    const promptInput = document.getElementById('promptInput');
    const keywordInput = document.getElementById('keywordInput');
    const submitBtn = document.getElementById('btnSubmit');

    let rawPrompt = promptInput.value.trim();
    let rawKeyword = keywordInput.value.trim();
    const targetLanguage = document.getElementById('languageSelect').value;
    const genre = document.getElementById('genreSelect').value;
    const outputDiv = document.getElementById('resultOutput');

    const invalidValues = ['', '없음', '아무거나', '아무꺼나', 'none', 'null', 'undefined', '없음.', '아무거나.'];
    
    let processedPrompt = invalidValues.includes(rawPrompt.toLowerCase()) 
      ? `상황에 어울리는 풍부한 연출적 아이디어를 구상해주세요.` 
      : rawPrompt;

    let processedKeyword = invalidValues.includes(rawKeyword.toLowerCase()) 
      ? `상황 및 분위기 키워드` 
      : rawKeyword;

    if (!processedPrompt && !processedKeyword) {
      processedPrompt = `참신한 소재와 연출을 자율적으로 구상해주세요.`;
      processedKeyword = `자유 키워드`;
    }

    const MAX_INPUT_LEN = 4000;
    if (processedPrompt.length > MAX_INPUT_LEN) {
      processedPrompt = processedPrompt.substring(0, MAX_INPUT_LEN);
      showToast("입력문이 너무 길어 상위 4000자까지 축소되어 처리됩니다.");
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "[ 생성 처리 중... ]";
    outputDiv.innerHTML = '<p style="color:var(--accent-color);">⏳ AI가 입력을 분석하여 생성 중입니다...</p>';

    const systemRules = `[시스템 지시사항]
1. 답변은 반드시 완벽하고 자연스러운 ${targetLanguage}로만 작성해야 합니다.
2. 사용자가 이미 세계관을 구상하여 입력한 경우, 그 설정을 단순 재정리하거나 되풀이하여 출력하지 마십시오.
3. 타 언어, 개발 코드, 특수 키워드(예: _EXTENSIONS 등)를 절대로 출력에 포함하지 마세요.
4. 어색한 번역투를 피하고 몰입감 있는 자연스러운 문장 구조를 사용하세요.
5. 마크다운 서식을 활용해 순수 결과물만 깔끔하게 출력하세요.`;

    let userPromptMessage = `${systemRules}\n\n`;

    if (currentMainTab === 'topic') {
      // 스크린샷 기반 주제 선정 프롬프트 통합 구성
      userPromptMessage += `[주제 선정 - 창작자 모드]
- 입력된 창작자의 세계관 및 상황: ${processedPrompt}
- 핵심 키워드: ${processedKeyword}

[작성 요구사항 및 출력 양식]
입력된 세계관과 키워드에 맞춰 서론이나 결론 인사말 없이 오직 아래 마크다운 양식 그대로 3개씩 아이디어를 제시해 주세요.

[ 단어형 주제 ]

*   (세계관/키워드에 어울리는 연출용 키워드 조합 1)
*   (세계관/키워드에 어울리는 연출용 키워드 조합 2)
*   (세계관/키워드에 어울리는 연출용 키워드 조합 3)

[ 상황형 주제 ]

*   (상위 단어와 세계관 요소를 결합하여 서술한 특정 상황 묘사문 1)
*   (상위 단어와 세계관 요소를 결합하여 서술한 특정 상황 묘사문 2)
*   (상위 단어와 세계관 요소를 결합하여 서술한 특정 상황 묘사문 3)`;
    } else if (currentMainTab === 'myWorld') {
      if (currentSubTab === 'world') {
        userPromptMessage += `[세계관 구상 - 초보자 모드]\n- 장르: ${genre}\n- 요구사항: ${processedPrompt}\n- 키워드: ${processedKeyword}\n\n[작성 요구사항]\n위 입력을 바탕으로 지리, 사회 구조, 핵심 규칙이 포함된 완성형 세계관 문서를 작성하세요.`;
      } else if (currentSubTab === 'character') {
        userPromptMessage += `[캐릭터 구상 - 초보자 모드]\n- 장르: ${genre}\n- 요구사항: ${processedPrompt}\n- 키워드: ${processedKeyword}\n\n[작성 요구사항]\n위 입력을 바탕으로 인물의 외형, 성격, 과거 서사, 행동 동기가 포함된 입체적인 캐릭터 프로필을 작성하세요.`;
      } else if (currentSubTab === 'plot') {
        userPromptMessage += `[플롯 구상 - 초보자 모드]\n- 장르: ${genre}\n- 사건 요약: ${processedPrompt}\n- 키워드: ${processedKeyword}\n\n[작성 요구사항]\n위 입력을 바탕으로 기승전결 사건 흐름 및 복선 포인트를 포함한 플롯을 작성하세요.`;
      }
    }

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    try {
      const response = await fetch('/generate', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({
          prompt: userPromptMessage
        })
      });

      clearTimeout(timeoutId);

      if (!response.ok) {
        let errMessage = `서버 응답 오류 (코드: ${response.status})`;
        try {
          const errData = await response.json();
          if (errData.error) errMessage = errData.error;
        } catch(e) {}
        throw new Error(errMessage);
      }

      const data = await response.json();
      
      if (!data.result) {
        throw new Error("서버에서 빈 결과가 반환되었습니다.");
      }

      rawMarkdownResult = cleanOutputText(data.result);
      outputDiv.innerHTML = marked.parse(rawMarkdownResult);

      const typeTag = currentMainTab === 'topic' ? '주제' : currentSubTab;
      saveToHistory(typeTag, rawMarkdownResult);

    } catch (error) {
      console.error("오류 상세 내용:", error);
      let showErrMsg = error.message;
      if (error.name === 'AbortError') {
        showErrMsg = "서버 응답 시간이 초과되었습니다 (60초 타임아웃). 입력 내용을 조금 줄여서 다시 시도해보세요.";
      }
      outputDiv.innerHTML = `<p style="color:red; font-weight:bold;">⚠️ 생성 실패:</p><p style="color:red;">${showErrMsg}</p>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "[ 생성 실행 ]";
    }
  }
</script>
</body>
</html>
