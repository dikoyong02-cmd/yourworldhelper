<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 이미지 생성기</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-sub-bg: #334155;
      --border-color: #475569;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --accent-color: #e0e7ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      text-align: center;
    }

    /* 상단 안내 박스 */
    .notice-box {
      background-color: var(--card-sub-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .notice-box strong {
      color: var(--accent-color);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      border-radius: 6px;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button.btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
      background-color: var(--bg-color);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎨 AI 이미지 생성기</h1>

    <!-- 상단 안내 문구 -->
    <div class="notice-box">
      💡 <strong>이용 안내:</strong> 이미지 생성을 위해 <strong>Hugging Face API 토큰</strong>이 필요합니다. [설정] 탭에 토큰을 입력해 주세요. (한 번 입력 시 자동 저장됩니다)
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('create')">생성하기</button>
      <button class="tab-btn" onclick="switchTab('settings')">설정</button>
    </div>

    <!-- 생성 탭 -->
    <div id="tab-create" class="tab-content active">
      <div class="form-group">
        <label for="promptInput">프롬프트 (영어 권장)</label>
        <textarea id="promptInput" placeholder="예: A cute cat wearing space suit, 8k resolution"></textarea>
      </div>
      <button class="btn-primary" onclick="generateImage()">이미지 만들기</button>

      <div class="canvas-container">
        <canvas id="resultCanvas" width="512" height="512"></canvas>
      </div>
    </div>

    <!-- 설정 탭 -->
    <div id="tab-settings" class="tab-content">
      <div class="form-group">
        <label for="hfTokenInput">Hugging Face API Token</label>
        <input type="password" id="hfTokenInput" placeholder="hf_xxxxxxxxxxxxxxxxxxxx" oninput="saveToken(this.value)">
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d');

    // 페이지 로드 시 초기화 및 저장된 토큰 불러오기
    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      loadToken();
    });

    // 캔버스 초기 상태 (안내 텍스트 출력)
    function initCanvas() {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('생성된 이미지가 여기에 표시됩니다.', canvas.width / 2, canvas.height / 2);
    }

    // 탭 전환 함수
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'create') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-create').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-settings').classList.add('active');
      }
    }

    // 토큰 저장 (localStorage)
    function saveToken(val) {
      localStorage.setItem('hf_token', val.trim());
    }

    // 토큰 불러오기
    function loadToken() {
      const savedToken = localStorage.getItem('hf_token');
      if (savedToken) {
        document.getElementById('hfTokenInput').value = savedToken;
      }
    }

    // API 호출 및 이미지 생성 함수
    async function generateImage() {
      const prompt = document.getElementById('promptInput').value.trim();
      const token = document.getElementById('hfTokenInput').value.trim();

      if (!token) {
        alert('Hugging Face API 토큰을 설정 탭에 입력해 주세요.');
        switchTab('settings');
        return;
      }

      if (!prompt) {
        alert('프롬프트를 입력해 주세요.');
        return;
      }

      // 로딩 표시
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#6366f1';
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('이미지 생성 중...', canvas.width / 2, canvas.height / 2);

      try {
        const response = await fetch(
          "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell",
          {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            method: "POST",
            body: JSON.stringify({ inputs: prompt }),
          }
        );

        if (!response.ok) {
          throw new Error('요청 실패: API 토큰이나 네트워크 상태를 확인해 주세요.');
        }

        const blob = await response.blob();
        const img = new Image();
        img.src = URL.createObjectURL(blob);

        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };

      } catch (error) {
        alert(error.message);
        initCanvas();
      }
    }
  </script>
</body>
</html>
