<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your World Helper - Y2K Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #008080;
      --card-bg: #c0c0c0;
      --card-sub-bg: #d4d0c8;
      --text-color: #000000;
      --border-color: #000000;
      --accent-color: #000080;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #000080;
      --footer-text: #404040;
      
      --canvas-bg: #0b3c3c;
      --canvas-grid: rgba(255, 255, 255, 0.12);
      --canvas-frame: #000080;
    }

    [data-theme="classic"] {
      --bg-color: #008080;
      --card-bg: #c0c0c0;
      --card-sub-bg: #d4d0c8;
      --text-color: #000000;
      --border-color: #000000;
      --accent-color: #000080;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #000080;
      --canvas-bg: #0b3c3c;
      --canvas-grid: rgba(255, 255, 255, 0.12);
      --canvas-frame: #000080;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --card-bg: #2d2d2d;
      --card-sub-bg: #3a3a3a;
      --text-color: #5cdb95;
      --border-color: #5cdb95;
      --accent-color: #d63484;
      --accent-text: #ffffff;
      --input-bg: #121212;
      --window-title-bg: #d63484;
      --canvas-bg: #121212;
      --canvas-grid: rgba(92, 219, 149, 0.15);
      --canvas-frame: #d63484;
    }

    [data-theme="emerald"] {
      --bg-color: #004d40;
      --card-bg: #b2dfdb;
      --card-sub-bg: #e0f2f1;
      --text-color: #00251a;
      --border-color: #00251a;
      --accent-color: #00796b;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #004d40;
      --canvas-bg: #00332c;
      --canvas-grid: rgba(178, 223, 219, 0.2);
      --canvas-frame: #004d40;
    }

    [data-theme="sunset"] {
      --bg-color: #800000;
      --card-bg: #ffcca8;
      --card-sub-bg: #ffe0cc;
      --text-color: #4a0000;
      --border-color: #4a0000;
      --accent-color: #d32f2f;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #800000;
      --canvas-bg: #3a0000;
      --canvas-grid: rgba(255, 204, 168, 0.2);
      --canvas-frame: #800000;
    }

    [data-theme="cyber"] {
      --bg-color: #161925;
      --card-bg: #232738;
      --card-sub-bg: #2d3247;
      --text-color: #70e0d6;
      --border-color: #70e0d6;
      --accent-color: #c77dff;
      --accent-text: #ffffff;
      --input-bg: #10121a;
      --window-title-bg: #c77dff;
      --canvas-bg: #10121a;
      --canvas-grid: rgba(112, 224, 214, 0.2);
      --canvas-frame: #c77dff;
    }

    [data-theme="pastel"] {
      --bg-color: #d8bfd8;
      --card-bg: #f5e6f5;
      --card-sub-bg: #ffffff;
      --text-color: #4b0082;
      --border-color: #4b0082;
      --accent-color: #ba55d3;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #ba55d3;
      --canvas-bg: #faf0fa;
      --canvas-grid: rgba(75, 0, 130, 0.12);
      --canvas-frame: #ba55d3;
    }

    [data-theme="matrix"] {
      --bg-color: #0d1b1e;
      --card-bg: #162a2d;
      --card-sub-bg: #1f3a3e;
      --text-color: #80ed99;
      --border-color: #57cc99;
      --accent-color: #38a3a5;
      --accent-text: #ffffff;
      --input-bg: #081214;
      --window-title-bg: #22577a;
      --canvas-bg: #050b0c;
      --canvas-grid: rgba(128, 237, 153, 0.2);
      --canvas-frame: #38a3a5;
    }

    [data-theme="bubblegum"] {
      --bg-color: #ffcbf2;
      --card-bg: #fde2e4;
      --card-sub-bg: #ffffff;
      --text-color: #5c3d51;
      --border-color: #8e5572;
      --accent-color: #a3a3f5;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #a3a3f5;
      --canvas-bg: #fff5fa;
      --canvas-grid: rgba(142, 85, 114, 0.15);
      --canvas-frame: #a3a3f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', 'Dotum', '굴림', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      touch-action: manipulation;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      padding: 10px;
      box-shadow: 4px 4px 0px #000000;
    }

    header {
      background: var(--window-title-bg);
      padding: 6px 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .theme-selector-box {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 11px;
    }

    .theme-selector-box select {
      padding: 3px 6px;
      font-size: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      outline: none;
    }

    .tab-btn, 
    .sub-tab-btn, 
    button.primary-btn, 
    .profile-btn,
    .board-tool-btn,
    .side-nav-btn,
    .small-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      outline: none;
      user-select: none;
      transition: background-color 0.1s, color 0.1s;
    }

    .tab-btn:active, 
    .sub-tab-btn:active, 
    button.primary-btn:active, 
    .profile-btn:active,
    .board-tool-btn:active,
    .side-nav-btn:active,
    .small-btn:active {
      background: var(--accent-color) !important;
      color: var(--accent-text) !important;
    }

    .tab-btn.active, 
    .sub-tab-btn.active,
    .board-tool-btn.active,
    .side-nav-btn.active {
      background: var(--accent-color);
      color: var(--accent-text);
    }

    .icon-btn {
      padding: 0 8px;
      font-size: 11px;
    }

    .small-btn {
      height: 20px;
      padding: 0 6px;
      font-size: 10px;
    }

    .side-nav-btn {
      width: 100%;
      height: 40px;
      font-size: 12px;
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    button.primary-btn {
      width: 100%;
    }

    .profile-btn {
      width: 100%;
    }

    .tab-container {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .sub-tab-container {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      padding-left: 2px;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 12px;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border-color);
      background: var(--card-sub-bg);
      padding: 12px;
    }

    .card-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
      background: var(--accent-color);
      color: var(--accent-text);
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      font-size: 10px;
      padding: 1px 6px;
      cursor: pointer;
      line-height: 1.2;
    }

    .card-title-btn:hover {
      background: #ffffff;
    }

    .collapsible-content {
      display: block;
    }

    .collapsible-content.collapsed {
      display: none;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-desc {
      font-size: 11px;
      font-weight: normal;
      color: var(--accent-color);
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      outline: none;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    input[type="text"], select, textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      padding: 6px;
      font-size: 12px;
      background: var(--input-bg);
      color: var(--text-color);
      outline: none;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    .result-box {
      min-height: 160px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .board-container {
      position: relative;
      width: 100%;
      height: 480px;
      background-color: var(--canvas-bg);
      background-image: 
        linear-gradient(var(--canvas-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--canvas-grid) 1px, transparent 1px);
      background-size: 20px 20px;
      border: 2px solid var(--canvas-frame);
      overflow: hidden;
      touch-action: none;
    }

    .board-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 6px;
      border: 1px solid var(--border-color);
    }

    .board-tool-group {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .node-card {
      position: absolute;
      background: var(--card-sub-bg);
      border: 1px solid var(--border-color);
      padding: 6px;
      width: 170px;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
      cursor: move;
      z-index: 20;
      touch-action: none;
    }

    .node-card.selected {
      border: 2px solid var(--accent-color);
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border-color);
    }

    .node-header input {
      font-weight: bold;
      font-size: 11px;
      padding: 2px;
      border: none;
      background: transparent;
      width: 120px;
    }

    .node-close-btn {
      background: #ff4d4d;
      color: white;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      line-height: 16px;
      text-align: center;
      z-index: 30;
    }

    sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-card {
      border: 1px solid var(--border-color);
      padding: 12px;
      background: var(--card-sub-bg);
      text-align: center;
    }

    .profile-img-box {
      width: 90px;
      height: 90px;
      border: 1px solid var(--border-color);
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--input-bg);
      overflow: hidden;
    }

    .profile-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .image-mode-select {
      margin-bottom: 6px;
    }

    .img-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cmd-setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .cmd-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .cmd-item label {
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
      width: 70px;
    }

    .cmd-item input {
      padding: 2px 4px;
      font-size: 11px;
      height: 22px;
    }

    /* 마크다운 렌더링 스타일링 */
    .markdown-body {
      font-size: 11px;
      line-height: 1.6;
    }

    .markdown-body h3 {
      font-size: 12px;
      margin-top: 12px;
      margin-bottom: 6px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 3px;
    }

    .markdown-body ul {
      padding-left: 18px;
      margin-bottom: 10px;
    }

    .markdown-body li {
      margin-bottom: 4px;
    }

    .markdown-body code {
      background: var(--input-bg);
      padding: 1px 4px;
      border: 1px solid var(--border-color);
      font-size: 10px;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent-color);
      padding-left: 8px;
      margin: 6px 0;
      color: var(--accent-color);
    }

    footer {
      margin-top: 15px;
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      text-align: center;
      font-size: 11px;
      color: var(--footer-text);
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-theme="classic">

<div class="container">
  <header>
    <h1>YOUR WORLD HELPER (v2.0)</h1>
    
    <div class="theme-selector-box">
      <label for="themeSelect">COLOR THEME:</label>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="classic">Classic Teal</option>
        <option value="dark">Dark Matrix</option>
        <option value="emerald">Emerald 98</option>
        <option value="sunset">Crimson Retro</option>
        <option value="cyber">Soft Cyber Neon</option>
        <option value="pastel">Pastel Violet</option>
        <option value="matrix">Cyber Matrix</option>
        <option value="bubblegum">Y2K Bubblegum</option>
      </select>
    </div>
  </header>

  <div class="tab-container">
    <button class="tab-btn active" id="myWorldBtn" onclick="selectMainTab('myWorld', this)">나만의 세상 만들기</button>
    <button class="tab-btn" onclick="selectMainTab('topic', this)">주제 선정</button>
    <button class="tab-btn" onclick="selectMainTab('plot', this)">플롯/스토리</button>
    <button class="tab-btn" onclick="selectMainTab('dialogue', this)">대사 생성</button>
    <button class="tab-btn" onclick="selectMainTab('guide', this)">사용 가이드</button>
  </div>

  <div class="sub-tab-container" id="subTabContainer">
    <button class="sub-tab-btn active" onclick="selectSubTab('world', this)">세계관 생성</button>
    <button class="sub-tab-btn" onclick="selectSubTab('character', this)">캐릭터 설정</button>
  </div>

  <main>
    <div class="content-area">
      <section class="card" id="inputSection">
        <div class="card-title" id="formTitle">세계관 설정 입력</div>
        
        <div class="form-group" id="genreGroup">
          <label>장르 / 테마</label>
          <select id="genreSelect">
            <option value="판타지">판타지</option>
            <option value="SF/사이버펑크">SF / 사이버펑크</option>
            <option value="현대 로맨스">현대 로맨스</option>
            <option value="미스터리/스릴러">미스터리 / 스릴러</option>
            <option value="무협/시대극">무협 / 시대극</option>
          </select>
        </div>

        <div class="form-group">
          <label id="keywordLabel">핵심 키워드</label>
          <input type="text" id="keywordInput" placeholder="예: 마법학교, 비밀 조직, 시간여행 등">
        </div>

        <div class="form-group">
          <div class="slider-header">
            <label for="aiLevelInput">AI 관여도 (창의성 Level)</label>
            <span id="aiLevelDesc" class="slider-desc">Lv.3 보통 (적절한 디테일 추가)</span>
          </div>
          <input type="range" id="aiLevelInput" min="1" max="5" value="3" oninput="updateAiLevelDesc(this.value)">
        </div>

        <div class="form-group">
          <label id="promptLabel">상세 요구사항 / 프롬프트 (선택)</label>
          <textarea id="promptInput" placeholder="추가로 들어가야 할 세부 내용을 입력해 주세요..."></textarea>
        </div>

        <button type="button" class="primary-btn" onclick="generateContent()">[ 생성 실행 ]</button>
      </section>

      <section class="card" id="boardSection" style="display: none;">
        <div class="card-title">RELATIONSHIP & STORY CANVAS</div>
        
        <div class="board-toolbar">
          <div class="board-tool-group">
            <button class="board-tool-btn active" id="tool-select" onclick="setBoardTool('select')">선택/이동</button>
            <button class="board-tool-btn" id="tool-draw" onclick="setBoardTool('draw')">펜 드로잉</button>
            <button class="board-tool-btn" id="tool-erase" onclick="setBoardTool('erase')">지우개</button>
            <button class="board-tool-btn" id="tool-link" onclick="setBoardTool('link')">화살표 연결</button>
            <button class="board-tool-btn icon-btn" id="tool-undo" onclick="undoCanvas()" title="되돌리기 (Ctrl+Z)">Ctrl+Z</button>
            <button class="board-tool-btn icon-btn" id="tool-redo" onclick="redoCanvas()" title="다시하기 (Ctrl+Y)">Ctrl+Y</button>
          </div>

          <div class="board-tool-group">
            <button class="board-tool-btn" id="btn-add-card" onclick="addBoardNode('text')">+카드 추가</button>
            <label class="board-tool-btn" id="btn-add-img" style="cursor: pointer;">
              +사진 추가
              <input type="file" id="boardImgUpload" accept="image/*" style="display: none;" onchange="addBoardImage(event)">
            </label>
            <button class="board-tool-btn" onclick="exportBoardData()">파일 저장(.json)</button>
            <label class="board-tool-btn" style="cursor: pointer;">
              불러오기
              <input type="file" accept=".json" style="display: none;" onchange="importBoardData(event)">
            </label>
          </div>
        </div>

        <div class="board-container" id="boardContainer">
          <canvas id="drawingCanvas" style="position: absolute; inset: 0; z-index: 10;"></canvas>
          <svg id="svgLayer" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;">
            <defs>
              <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" id="arrowPoly"/>
              </marker>
            </defs>
          </svg>
          <div id="nodesContainer" style="position: absolute; inset: 0; z-index: 20; pointer-events: none;"></div>
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label style="margin-bottom: 0;">통합 스토리 서술 노트 (자동 저장됨)</label>
            <button class="small-btn" id="btn-reset-draw" onclick="clearCanvasDrawing()">드로잉 초기화</button>
          </div>
          <textarea id="boardStoryText" placeholder="캔버스 상의 관계도를 기반으로 전체 이야기 흐름 및 사건 전개를 서술해 주세요..." style="height: 80px;" oninput="saveBoardState()"></textarea>
        </div>
      </section>

      <article class="card" id="resultSection">
        <div class="card-title">생성 결과</div>
        <div id="resultOutput" class="result-box markdown-body">결과가 여기에 표시됩니다.</div>
      </article>

      <section class="card" id="guideSection" style="display: none;">
        <div class="card-title">SYSTEM MANUAL (사용 가이드)</div>
        <div class="markdown-body" id="guideContent"></div>
      </section>
    </div>

    <sidebar>
      <div class="profile-card">
        <div class="card-title">USER PROFILE</div>
        <div class="profile-img-box">
          <img id="profilePreview" src="" alt="프로필 사진">
          <div id="profilePlaceholder" style="font-size: 11px;">NO IMAGE</div>
        </div>
        <div style="font-weight: bold; font-size: 12px; margin-bottom: 6px;">User_01</div>
        <div class="image-mode-select">
          <select id="fitModeSelect" onchange="changeImageFitMode(this.value)" style="font-size: 10px; padding: 2px;">
            <option value="cover">Fit: Cover</option>

<script>
  // 마크다운 형태의 시스템 매뉴얼 가이드
  const systemManualMarkdown = `
### SECTION 1. 기능별 생성 가이드 (세계관, 주제, 플롯, 대사)
* **세계관/캐릭터 생성**: 메인 탭의 \`나만의 세상 만들기\`에서 장르 및 키워드를 입력하여 세계관과 캐릭터 설정을 빠르게 구축합니다.

* **대사 생성**: \`대사 생성\` 탭에서 상황과 인물 성격에 맞는 자연스러운 대사를 즉시 출력합니다.

### SECTION 2. 스토리 캔버스 및 칠판 기능

### SECTION 4. 프로필 & 데이터 저장 관리
* **프로필 이미지**: 로컬 파일 등록 및 외부 웹 이미지 URL 등록을 지원합니다.

### SECTION 5. AI 활용 표기 및 저작권 주의사항
* **AI 사용 사실 명시**: 본 툴을 이용하여 생성한 결과물을 출판, 공모전 제출, 외부 공개 시 **"생성형 AI를 활용하여 작성됨"** 문구를 표기하는 것을 권장합니다.
* **수정 및 창작성 가공 권장**: 초안을 그대로 사용하기보다는 작가 본인의 개성 있는 연출로 **직접 수정 및 2차 가공**을 진행해야 저작권을 안전하게 보호받을 수 있습니다.
* **타인 권리 침해 주의**: 고유명사, 타인의 유명 작품, 특정 인물의 화풍을 프롬프트로 과도하게 언급하여 생성하는 경우 저작권 및 상표권 침해 위험이 발생할 수 있습니다.
`;

  let currentMainTab = 'myWorld';
  let currentSubTab = 'world';

  // Board Canvas Variables
  let boardTool = 'select';
  let isDrawing = false;
  let lastX = 0, lastY = 0;
  let boardNodes = [];
  let boardLinks = [];
  let linkStartNodeId = null;

  // Undo/Redo History Stacks
  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 20;

  const canvas = document.getElementById('drawingCanvas');
  const ctx = canvas.getContext('2d');

  // Command Settings Defaults
  let commandSettings = {
    draw: "B",
    erase: "C",
    select: "S",
    link: "L",
    addCard: "+Card",
    addImg: "+Img",
    undo: "Ctrl+Z",
    redo: "Ctrl+Y",
    resetDraw: "Reset"
  };

  const aiLevelDescriptions = {
    "1": "Lv.1 최소 (입력 내용 및 키워드 유지, 다듬기)",
    "2": "Lv.2 절제 (약간의 설정 보완)",
    "3": "Lv.3 보통 (적절한 디테일 추가)",
    "4": "Lv.4 높음 (창의적 요소 적극 추가)",
    "5": "Lv.5 최대 (자유롭고 파격적인 스토리 확장)"
  };

  window.addEventListener('DOMContentLoaded', () => {
    // 가이드 영역 마크다운 렌더링
    document.getElementById('guideContent').innerHTML = marked.parse(systemManualMarkdown);

    const savedTheme = localStorage.getItem('app_theme') || 'classic';
    document.getElementById('themeSelect').value = savedTheme;
    changeTheme(savedTheme);

    const savedImg = localStorage.getItem('user_profile_img');
    if (savedImg) showImage(savedImg);

    const savedFitMode = localStorage.getItem('user_profile_fit') || 'cover';
    document.getElementById('fitModeSelect').value = savedFitMode;
    changeImageFitMode(savedFitMode);

    const savedMemo = localStorage.getItem('user_memo');
    if (savedMemo) document.getElementById('memoInput').value = savedMemo;

    const settingsCollapsed = localStorage.getItem('settings_collapsed') === 'true';
    if (settingsCollapsed) {
      document.getElementById('settingsContent').classList.add('collapsed');
      document.getElementById('settingsToggleBtn').innerText = '▲ 열기';
    }

    loadCommandSettings();

    initCanvas();
    loadBoardState();

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        if (e.shiftKey) {
          redoCanvas();
        } else {
          undoCanvas();
        }
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        redoCanvas();
      }
    });
  });

  /* ---------------- TOGGLE SETTINGS CARD ---------------- */
  function toggleSettingsCard() {
    const content = document.getElementById('settingsContent');
    const btn = document.getElementById('settingsToggleBtn');
    
    if (content.classList.contains('collapsed')) {
      content.classList.remove('collapsed');
      btn.innerText = '▼ 접기';
      localStorage.setItem('settings_collapsed', 'false');
    } else {
      content.classList.add('collapsed');
      btn.innerText = '▲ 열기';
      localStorage.setItem('settings_collapsed', 'true');
    }
  }

  /* ---------------- COMMAND SETTINGS LOGIC ---------------- */
  function applyCommandUI() {
    // 상단 캔버스 버튼 이름은 한글로 고정하고, SETTINGS 입력창 값만 유지합니다.
    document.getElementById('cmd-draw').value = commandSettings.draw;
    document.getElementById('cmd-erase').value = commandSettings.erase;
    document.getElementById('cmd-select').value = commandSettings.select;
    document.getElementById('cmd-link').value = commandSettings.link;
    document.getElementById('cmd-add-card').value = commandSettings.addCard;
    document.getElementById('cmd-add-img').value = commandSettings.addImg;
    document.getElementById('cmd-undo').value = commandSettings.undo;
    document.getElementById('cmd-redo').value = commandSettings.redo;
    document.getElementById('cmd-reset-draw').value = commandSettings.resetDraw;
  }

  function readCommandInputs() {
    commandSettings.draw = document.getElementById('cmd-draw').value;
    commandSettings.erase = document.getElementById('cmd-erase').value;
    commandSettings.select = document.getElementById('cmd-select').value;
    commandSettings.link = document.getElementById('cmd-link').value;
    commandSettings.addCard = document.getElementById('cmd-add-card').value;
    commandSettings.addImg = document.getElementById('cmd-add-img').value;
    commandSettings.undo = document.getElementById('cmd-undo').value;
    commandSettings.redo = document.getElementById('cmd-redo').value;
    commandSettings.resetDraw = document.getElementById('cmd-reset-draw').value;
  }

  function saveCommandsTemp() {
    readCommandInputs();
    localStorage.setItem('user_command_settings', JSON.stringify(commandSettings));
    applyCommandUI();
    alert('명령어 설정이 임시저장되었습니다.');
  }

  function loadCommandSettings() {
    const saved = localStorage.getItem('user_command_settings');
    if (saved) {
      try {
        commandSettings = { ...commandSettings, ...JSON.parse(saved) };
      } catch (e) { console.error(e); }
    }
    applyCommandUI();
  }

  function exportCommandSettings() {
    readCommandInputs();
    const dataStr = JSON.stringify(commandSettings, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'command_settings.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importCommandSettings(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const imported = JSON.parse(evt.target.result);
        commandSettings = { ...commandSettings, ...imported };
        localStorage.setItem('user_command_settings', JSON.stringify(commandSettings));
        applyCommandUI();
        alert('명령어 설정을 파일에서 불러왔습니다.');
      } catch (err) {
        alert('올바르지 않은 설정 JSON 파일입니다.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function changeTheme(themeName) {
    document.body.setAttribute('data-theme', themeName);
    localStorage.setItem('app_theme', themeName);
    renderBoardLinks();
  }

  function updateAiLevelDesc(val) {
    document.getElementById('aiLevelDesc').innerText = aiLevelDescriptions[val];
  }

  function selectMainTab(tabType, element) {
    currentMainTab = tabType;
    document.querySelectorAll('.tab-btn, .side-nav-btn').forEach(btn => btn.classList.remove('active'));
    if (element) element.classList.add('active');

    const subTabContainer = document.getElementById('subTabContainer');
    const inputSection = document.getElementById('inputSection');
    const boardSection = document.getElementById('boardSection');
    const resultSection = document.getElementById('resultSection');
    const guideSection = document.getElementById('guideSection');

    if (tabType === 'myWorld') {
      subTabContainer.style.display = 'flex';
      inputSection.style.display = 'block';
      boardSection.style.display = 'none';
      resultSection.style.display = 'block';
      guideSection.style.display = 'none';
      selectSubTab(currentSubTab, document.querySelector('.sub-tab-btn.active'));
    } else if (tabType === 'relation') {
      subTabContainer.style.display = 'none';
      inputSection.style.display = 'none';
      boardSection.style.display = 'block';
      resultSection.style.display = 'none';
      guideSection.style.display = 'none';
      setTimeout(resizeCanvas, 50);
    } else if (tabType === 'guide') {
      subTabContainer.style.display = 'none';
      inputSection.style.display = 'none';
      boardSection.style.display = 'none';
      resultSection.style.display = 'none';
      guideSection.style.display = 'block';
    } else {
      subTabContainer.style.display = 'none';
      inputSection.style.display = 'block';
      boardSection.style.display = 'none';
      resultSection.style.display = 'block';

  function selectSubTab(subType, element) {
    currentSubTab = subType;
    document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
    if (element) element.classList.add('active');

    if (subType === 'world') {
      document.getElementById('genreGroup').style.display = 'block';
      updateFormText('세계관 설정 입력', '예: 마법학교, 비밀 조직 등', '세부 내용을 입력해 주세요...');
    } else {
      document.getElementById('genreGroup').style.display = 'none';
      updateFormText('캐릭터 설정 입력', '예: 주연 이름, 역할 등', '캐릭터 외형 및 배경 스토리를 입력해 주세요...');
    }
  }

  function updateFormText(title, keyPlaceholder, promptPlaceholder) {
    document.getElementById('formTitle').innerText = title;
    document.getElementById('keywordInput').placeholder = keyPlaceholder;
    document.getElementById('promptInput').placeholder = promptPlaceholder;
  }

  /* ---------------- CANVAS & DRAWING (TOUCH SUPPORT) ---------------- */
  function initCanvas() {
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      startDrawing(touch);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (isDrawing) e.preventDefault();
      const touch = e.touches[0];
      draw(touch);
    }, { passive: false });

    canvas.addEventListener('touchend', stopDrawing);
  }

  function resizeCanvas() {
    const container = document.getElementById('boardContainer');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
  }

  function setBoardTool(tool) {
    boardTool = tool;
    document.querySelectorAll('.board-tool-btn').forEach(b => {
      if (b.id && b.id.startsWith('tool-')) b.classList.remove('active');
    });
    const activeBtn = document.getElementById(`tool-${tool}`);
    if (activeBtn) activeBtn.classList.add('active');

    if (tool === 'draw' || tool === 'erase') {
      canvas.style.pointerEvents = 'auto';
    } else {
      canvas.style.pointerEvents = 'none';
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function startDrawing(e) {
    if (boardTool !== 'draw' && boardTool !== 'erase') return;
    saveSnapshot();
    isDrawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);

    const style = getComputedStyle(document.body);
    const textColor = style.getPropertyValue('--text-color').trim() || '#ffffff';

    if (boardTool === 'draw') {
      ctx.strokeStyle = textColor;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.globalCompositeOperation = 'source-over';
    } else if (boardTool === 'erase') {
      ctx.lineWidth = 25;
      ctx.lineCap = 'round';
      ctx.globalCompositeOperation = 'destination-out';
    }

    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  }

  function stopDrawing() {
    if (isDrawing) {
      isDrawing = false;
      saveBoardState();
    }
  }

  function clearCanvasDrawing() {
    saveSnapshot();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    saveBoardState();
  }

  /* ---------------- UNDO / REDO LOGIC ---------------- */
  function saveSnapshot() {
    const state = {
      nodes: JSON.parse(JSON.stringify(boardNodes)),
      links: JSON.parse(JSON.stringify(boardLinks)),
      canvasImg: canvas.toDataURL()
    };
    undoStack.push(state);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
  }

  function undoCanvas() {
    if (undoStack.length === 0) return;

    const currentState = {
      nodes: JSON.parse(JSON.stringify(boardNodes)),
      links: JSON.parse(JSON.stringify(boardLinks)),
      canvasImg: canvas.toDataURL()
    };
    redoStack.push(currentState);

    const prev = undoStack.pop();
    applyState(prev);
  }

  function redoCanvas() {
    if (redoStack.length === 0) return;

    const currentState = {
      nodes: JSON.parse(JSON.stringify(boardNodes)),
      links: JSON.parse(JSON.stringify(boardLinks)),
      canvasImg: canvas.toDataURL()
    };
    undoStack.push(currentState);

    const next = redoStack.pop();
    applyState(next);
  }

  function applyState(state) {
    boardNodes = state.nodes || [];
    boardLinks = state.links || [];
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (state.canvasImg) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0);
      img.src = state.canvasImg;
    }
    renderBoardNodes();
    saveBoardState();
  }

  /* ---------------- NODES & ARROWS ---------------- */
  function addBoardNode(type, x = 30, y = 30, title = '카드 요소', desc = '') {
    saveSnapshot();
    const id = 'node_' + Date.now();
    boardNodes.push({ id, type, x, y, title, desc });
    renderBoardNodes();
    saveBoardState();
  }

  function addBoardImage(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      saveSnapshot();
      const id = 'node_' + Date.now();
      boardNodes.push({ id, type: 'image', x: 50, y: 50, title: '사진 카드', imgSrc: evt.target.result });
      renderBoardNodes();
      saveBoardState();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function renderBoardNodes() {
    const container = document.getElementById('nodesContainer');
    container.innerHTML = '';

    boardNodes.forEach(node => {
      const card = document.createElement('div');
      card.className = 'node-card';
      card.style.left = node.x + 'px';
      card.style.top = node.y + 'px';
      card.style.pointerEvents = 'auto';

      let bodyHtml = '';
      if (node.type === 'text') {
        bodyHtml = `<textarea onchange="updateNodeDesc('${node.id}', this.value)" style="height: 50px; font-size: 11px;">${node.desc || ''}</textarea>`;
      } else if (node.type === 'image') {
        bodyHtml = `<img src="${node.imgSrc}" style="width: 100%; height: 80px; object-fit: cover;">`;
      }

      card.innerHTML = `
        <div class="node-header">
          <input type="text" value="${node.title}" onchange="updateNodeTitle('${node.id}', this.value)">
          <div class="node-close-btn" onclick="deleteNode(event, '${node.id}')">X</div>
        </div>
        ${bodyHtml}
      `;

      bindNodeDrag(card, node);
      container.appendChild(card);
    });
    renderBoardLinks();
  }

  function bindNodeDrag(card, node) {
    let isDragging = false;
    let startX, startY;

    const onStart = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.classList.contains('node-close-btn')) return;

      if (boardTool === 'link') {
        handleLinkNodes(node.id);
        return;
      }

      if (boardTool !== 'select') return;

      saveSnapshot();
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX - node.x;
      startY = clientY - node.y;

      const onMove = (me) => {
        if (!isDragging) return;
        const curX = me.touches ? me.touches[0].clientX : me.clientX;
        const curY = me.touches ? me.touches[0].clientY : me.clientY;

        node.x = curX - startX;
        node.y = curY - startY;
        card.style.left = node.x + 'px';
        card.style.top = node.y + 'px';
        renderBoardLinks();
      };

      const onEnd = () => {
        isDragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        saveBoardState();
      };

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    };

    card.addEventListener('mousedown', onStart);
    card.addEventListener('touchstart', onStart, { passive: false });
  }

  function deleteNode(e, id) {
    e.stopPropagation();
    saveSnapshot();
    boardNodes = boardNodes.filter(n => n.id !== id);
    boardLinks = boardLinks.filter(l => l.from !== id && l.to !== id);
    renderBoardNodes();
    saveBoardState();
  }

  function handleLinkNodes(id) {
    if (!linkStartNodeId) {
      linkStartNodeId = id;
      alert('연결할 대상 카드를 선택하세요.');
    } else if (linkStartNodeId !== id) {
      saveSnapshot();
      boardLinks.push({ id: 'link_' + Date.now(), from: linkStartNodeId, to: id });
      linkStartNodeId = null;
      renderBoardNodes();
      saveBoardState();
    } else {
      linkStartNodeId = null;
    }
  }

  function renderBoardLinks() {
    const svg = document.getElementById('svgLayer');
    const arrowPoly = document.getElementById('arrowPoly');
    
    const oldLines = svg.querySelectorAll('line');
    oldLines.forEach(l => l.remove());

    const style = getComputedStyle(document.body);
    const strokeColor = style.getPropertyValue('--border-color').trim() || '#ffffff';
    if (arrowPoly) arrowPoly.setAttribute('fill', strokeColor);

    boardLinks.forEach(link => {
      const fromNode = boardNodes.find(n => n.id === link.from);
      const toNode = boardNodes.find(n => n.id === link.to);
      if (!fromNode || !toNode) return;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', fromNode.x + 85);
      line.setAttribute('y1', fromNode.y + 40);
      line.setAttribute('x2', toNode.x + 85);
      line.setAttribute('y2', toNode.y + 40);
      line.setAttribute('stroke', strokeColor);
      line.setAttribute('stroke-width', '2');
      line.setAttribute('marker-end', 'url(#arrowhead)');

      svg.appendChild(line);
    });
  }

  function updateNodeTitle(id, val) {
    const node = boardNodes.find(n => n.id === id);
    if (node) { node.title = val; saveBoardState(); }
  }

  function updateNodeDesc(id, val) {
    const node = boardNodes.find(n => n.id === id);
    if (node) { node.desc = val; saveBoardState(); }
  }

  /* ---------------- BOARD SAVE / IMPORT / EXPORT ---------------- */
  function saveBoardState() {
    const state = {
      nodes: boardNodes,
      links: boardLinks,
      story: document.getElementById('boardStoryText').value,
      canvasImg: canvas.toDataURL()
    };
    localStorage.setItem('user_board_state', JSON.stringify(state));
  }

  function loadBoardState() {
    const saved = localStorage.getItem('user_board_state');
    if (!saved) return;
    try {
      const data = JSON.parse(saved);
      boardNodes = data.nodes || [];
      boardLinks = data.links || [];
      document.getElementById('boardStoryText').value = data.story || '';

      if (data.canvasImg) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = data.canvasImg;
      }
      renderBoardNodes();
    } catch (e) {
      console.error(e);
    }
  }

  function exportBoardData() {
    saveBoardState();
    const dataStr = localStorage.getItem('user_board_state');
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'story_canvas_data.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBoardData(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        saveSnapshot();
        const data = JSON.parse(evt.target.result);
        boardNodes = data.nodes || [];
        boardLinks = data.links || [];
        document.getElementById('boardStoryText').value = data.story || '';
        renderBoardNodes();
        saveBoardState();
      } catch (err) {
        alert('올바르지 않은 JSON 파일입니다.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  /* ---------------- COMMON PROFILE & MEMO ---------------- */
  function loadProfileImageFromFile(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        showImage(e.target.result);
        localStorage.setItem('user_profile_img', e.target.result);
      };
      reader.readAsDataURL(file);
    }
  }

  function promptImageUrl() {
    const url = prompt('이미지 URL을 입력하세요:');
    if (url) {
      showImage(url);
      localStorage.setItem('user_profile_img', url);
    }
  }

  function showImage(src) {
    const preview = document.getElementById('profilePreview');
    const placeholder = document.getElementById('profilePlaceholder');
    preview.src = src;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  }

  function changeImageFitMode(mode) {
    document.getElementById('profilePreview').style.objectFit = mode;
    localStorage.setItem('user_profile_fit', mode);
  }

  function saveMemo(text) {
    localStorage.setItem('user_memo', text);
  }

  async function generateContent() {
    const keyword = document.getElementById('keywordInput').value;
    const prompt = document.getElementById('promptInput').value;
    const aiLevel = document.getElementById('aiLevelInput').value;
    const outputDiv = document.getElementById('resultOutput');

    if (!keyword.trim() && !prompt.trim()) {
      alert('키워드를 입력해 주세요!');
      return;
    }

    outputDiv.innerHTML = '생성 중...';

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: `[키워드: ${keyword}] [Lv.${aiLevel}] ${prompt}` })
      });
      const data = await response.json();
      outputDiv.innerHTML = data.result ? marked.parse(data.result) : '오류 발생';
    } catch (err) {
      outputDiv.innerHTML = '통신 오류가 발생했습니다.';
    }
  }
</script>
