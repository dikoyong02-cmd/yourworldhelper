<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your World Helper</title>
  <!-- 마크다운 렌더링 라이브러리 (marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    }

    body {
      background-color: #f4f4f6;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      background: #ffffff;
      border: 2px solid #333;
      padding: 20px;
    }

    /* 상단 헤더 */
    header {
      border-bottom: 2px solid #333;
      padding-bottom: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
      font-weight: bold;
    }

    /* 메인 2단 레이아웃 (Grid) */
    main {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }

    /* 왼쪽 콘텐츠 영역 */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      border: 2px solid #333;
      background: #fafafa;
      padding: 15px;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px dashed #aaa;
      padding-bottom: 5px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border: 1px solid #777;
      padding: 10px;
      resize: vertical;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button.primary-btn {
      width: 100%;
      padding: 10px;
      background: #333;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button.primary-btn:hover {
      background: #555;
    }

    /* 결과 출력 영역 */
    .result-box {
      min-height: 150px;
      background: #fff;
      border: 1px dashed #777;
      padding: 15px;
      line-height: 1.6;
    }

    /* 오른쪽 사이드바 영역 */
    sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 프로필 카드 UI */
    .profile-card {
      border: 2px solid #333;
      padding: 15px;
      background: #ffffff;
      text-align: center;
    }

    .profile-img-box {
      width: 110px;
      height: 110px;
      border: 1px solid #777;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      overflow: hidden;
    }

    .profile-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .profile-btn {
      border: 1px solid #333;
      background: #f0f0f0;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .profile-btn:hover {
      background: #e0e0e0;
    }

    /* 하단 푸터 */
    footer {
      margin-top: 20px;
      border-top: 2px solid #333;
      padding-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }

    /* 반응형 스타일 (모바일 환경 고려) */
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 헤더 -->
  <header>
    <h1>🌐 Your World Helper</h1>
    <div>
      <span style="font-size: 13px; color: #666;">2D Flat Retro Style</span>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main>
    <!-- 왼쪽: AI 생성 기능 영역 -->
    <div class="content-area">
      <section class="card">
        <div class="card-title">💡 프롬프트 입력</div>
        <textarea id="promptInput" placeholder="생성할 아이디어나 질문을 입력해 주세요..."></textarea>
        <button type="button" class="primary-btn" onclick="generateContent()">생성하기</button>
      </section>

      <article class="card">
        <div class="card-title">📝 생성 결과</div>
        <div id="resultOutput" class="result-box">결과가 여기에 표시됩니다.</div>
      </article>
    </div>

    <!-- 오른쪽: 사이드바 (프로필 및 추가 정보) -->
    <sidebar>
      <div class="profile-card">
        <div class="card-title">USER PROFILE</div>
        <div class="profile-img-box">
          <img id="profilePreview" src="" alt="프로필 사진">
          <div id="profilePlaceholder" style="color: #888; font-size: 12px;">
            <span style="font-size: 20px; display: block; margin-bottom: 4px;">🖼️</span>
            이미지 없음
          </div>
        </div>

        <div style="font-weight: bold; font-size: 14px; margin-bottom: 10px;" id="userName">User</div>

        <input type="file" id="profileInput" accept="image/*" style="display: none;" onchange="loadProfileImage(event)">
        <button type="button" class="profile-btn" onclick="document.getElementById('profileInput').click()">📷 사진 변경</button>
      </div>

      <div class="card">
        <div class="card-title">📌 메모장</div>
        <p style="font-size: 12px; color: #666; line-height: 1.4;">
          필요한 메모나 아이디어를 기록해두는 사이드 스페이스입니다.
        </p>
      </div>
    </sidebar>
  </main>

  <!-- 하단 푸터 -->
  <footer>
    <p>© 2026 yourworldhelper. All rights reserved.</p>
  </footer>
</div>

<script>
  // 페이지 로드시 저장된 프로필 이미지 불러오기
  window.addEventListener('DOMContentLoaded', () => {
    const savedImg = localStorage.getItem('user_profile_img');
    if (savedImg) {
      showImage(savedImg);
    }
  });

  // 프로필 이미지 선택 및 저장
  function loadProfileImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imageData = e.target.result;
        showImage(imageData);
        localStorage.setItem('user_profile_img', imageData);
      };
      reader.readAsDataURL(file);
    }
  }

  function showImage(src) {
    const preview = document.getElementById('profilePreview');
    const placeholder = document.getElementById('profilePlaceholder');
    preview.src = src;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  }

  // 백엔드 Express API 호출 (/api/generate)
  async function generateContent() {
    const prompt = document.getElementById('promptInput').value;
    const outputDiv = document.getElementById('resultOutput');

    if (!prompt.trim()) {
      alert('내용을 입력해 주세요!');
      return;
    }

    outputDiv.innerHTML = '생성 중...';

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });

      const data = await response.json();

      if (data.result) {
        // 마크다운 파싱 처리 후 출력
        outputDiv.innerHTML = marked.parse(data.result);
      } else {
        outputDiv.innerHTML = '오류 발생: ' + (data.error || '답변을 불러오지 못했습니다.');
      }
    } catch (err) {
      console.error(err);
      outputDiv.innerHTML = '서버 통신 오류가 발생했습니다.';
    }
  }
</script>

</body>
</html>
