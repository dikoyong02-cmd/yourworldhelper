<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your World Helper - Y2K Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #008080;
      --card-bg: #c0c0c0;
      --card-sub-bg: #d4d0c8;
      --text-color: #000000;
      --border-color: #000000;
      --accent-color: #000080;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #000080;
      --footer-text: #404040;
      --canvas-bg: #0b3c3c;
      --canvas-grid: rgba(255, 255, 255, 0.12);
      --canvas-frame: #000080;
    }

    [data-theme="bubblegum"] {
      --bg-color: #ffcbf2;
      --card-bg: #fde2e4;
      --card-sub-bg: #ffffff;
      --text-color: #5c3d51;
      --border-color: #8e5572;
      --accent-color: #a3a3f5;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
      --window-title-bg: #a3a3f5;
      --canvas-bg: #fff5fa;
      --canvas-grid: rgba(142, 85, 114, 0.15);
      --canvas-frame: #a3a3f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', 'Dotum', '굴림', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; touch-action: manipulation; }
    .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); border: 2px solid var(--border-color); padding: 10px; box-shadow: 4px 4px 0px #000000; }
    header { background: var(--window-title-bg); padding: 6px 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
    header h1 { font-size: 14px; font-weight: bold; color: #ffffff; }
    .theme-selector-box { display: flex; align-items: center; gap: 6px; color: #ffffff; font-size: 11px; }
    .theme-selector-box select { padding: 3px 6px; font-size: 11px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); }
    
    .tab-btn, .sub-tab-btn, button.primary-btn, .profile-btn, .board-tool-btn, .side-nav-btn, .small-btn {
      display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 10px;
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);
      font-size: 11px; font-weight: bold; cursor: pointer; outline: none; user-select: none;
    }
    .tab-btn.active, .sub-tab-btn.active, .board-tool-btn.active, .side-nav-btn.active { background: var(--accent-color); color: var(--accent-text); }
    .side-nav-btn { width: 100%; height: 40px; font-size: 12px; border: 2px solid var(--border-color); }
    button.primary-btn, .profile-btn { width: 100%; }

    .tab-container { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
    .sub-tab-container { display: flex; gap: 4px; margin-bottom: 12px; padding-left: 2px; }
    main { display: grid; grid-template-columns: 1fr 260px; gap: 12px; }
    .content-area { display: flex; flex-direction: column; gap: 12px; }
    .card { border: 1px solid var(--border-color); background: var(--card-sub-bg); padding: 12px; }
    .card-title { font-size: 12px; font-weight: bold; margin-bottom: 10px; background: var(--accent-color); color: var(--accent-text); padding: 4px 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; }
    .slider-desc { font-size: 11px; color: var(--accent-color); }
    input[type="range"] { width: 100%; height: 6px; background: var(--input-bg); border: 1px solid var(--border-color); accent-color: var(--accent-color); cursor: pointer; }
    input[type="text"], select, textarea { width: 100%; border: 1px solid var(--border-color); padding: 6px; font-size: 12px; background: var(--input-bg); color: var(--text-color); outline: none; }
    textarea { height: 80px; resize: vertical; }

    .result-box { min-height: 160px; background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px; font-size: 12px; line-height: 1.5; }
    .board-container { position: relative; width: 100%; height: 480px; background-color: var(--canvas-bg); border: 2px solid var(--canvas-frame); overflow: hidden; touch-action: none; }
    .board-viewport { position: absolute; width: 100%; height: 100%; transform-origin: 0 0; background-image: linear-gradient(var(--canvas-grid) 1px, transparent 1px), linear-gradient(90deg, var(--canvas-grid) 1px, transparent 1px); background-size: 20px 20px; }
    .board-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 6px; border: 1px solid var(--border-color); }
    
    sidebar { display: flex; flex-direction: column; gap: 12px; }
    .profile-card { border: 1px solid var(--border-color); padding: 12px; background: var(--card-sub-bg); text-align: center; }
    .profile-img-box { width: 90px; height: 90px; border: 1px solid var(--border-color); margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; background: var(--input-bg); overflow: hidden; }
    .profile-img-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    
    footer { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 8px; text-align: center; font-size: 11px; color: var(--footer-text); }
    @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-theme="bubblegum">

<div class="container">
  <header>
    <h1>YOUR WORLD HELPER (v2.0)</h1>
    <div class="theme-selector-box">
      <label for="themeSelect">COLOR THEME:</label>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="bubblegum">Y2K Bubblegum</option>
        <option value="classic">Classic Teal</option>
      </select>
    </div>
  </header>

  <div class="tab-container">
    <button class="tab-btn active" onclick="selectMainTab('myWorld', this)">나만의 세상 만들기</button>
    <button class="tab-btn" onclick="selectMainTab('topic', this)">주제 선정</button>
    <button class="tab-btn" onclick="selectMainTab('plot', this)">플롯/스토리</button>
    <button class="tab-btn" onclick="selectMainTab('dialogue', this)">대사 생성</button>
  </div>

  <div class="sub-tab-container" id="subTabContainer">
    <button class="sub-tab-btn active" onclick="selectSubTab('world', this)">세계관 생성</button>
    <button class="sub-tab-btn" onclick="selectSubTab('character', this)">캐릭터 설정</button>
  </div>

  <main>
    <div class="content-area">
      <!-- 폼 입력 섹션 (요구사항 -> AI 관여도 -> 키워드) -->
      <section class="card" id="inputSection">
        <div class="card-title" id="formTitle">세계관 설정 입력</div>
        
        <div class="form-group" id="genreGroup">
          <label>장르 / 테마</label>
          <select id="genreSelect">
            <option value="판타지">판타지</option>
            <option value="SF/사이버펑크">SF / 사이버펑크</option>
            <option value="현대 로맨스">현대 로맨스</option>
            <option value="미스터리/스릴러">미스터리 / 스릴러</option>
            <option value="무협/시대극">무협 / 시대극</option>
          </select>
        </div>

        <!-- 1. 상세 요구사항 -->
        <div class="form-group">
          <label>상세 요구사항 / 프롬프트</label>
          <textarea id="promptInput" placeholder="추가로 들어가야 할 세부 내용이나 원하는 분위기를 입력해 주세요..."></textarea>
        </div>

        <!-- 2. AI 관여도 -->
        <div class="form-group">
          <div class="slider-header">
            <label for="aiLevelInput">AI 관여도 (창의성 Level)</label>
            <span id="aiLevelDesc" class="slider-desc">Lv.3 보통 (적절한 디테일 추가)</span>
          </div>
          <input type="range" id="aiLevelInput" min="1" max="5" value="3" oninput="updateAiLevelDesc(this.value)">
        </div>

        <!-- 3. 핵심 키워드 -->
        <div class="form-group">
          <label>핵심 키워드 (선택)</label>
          <input type="text" id="keywordInput" placeholder="미입력 시 맥락/캐릭터 설정에 맞춰 AI가 자동 생성합니다.">
        </div>

        <button type="button" class="primary-btn" onclick="generateContent()">[ 생성 실행 ]</button>
      </section>

      <!-- 생성 결과 출력 영역 -->
      <article class="card" id="resultSection">
        <div class="card-title">생성 결과</div>
        <div id="resultOutput" class="result-box markdown-body">결과가 여기에 표시됩니다.</div>
      </article>
    </div>

    <!-- 우측 사이드바 -->
    <sidebar>
      <div class="profile-card">
        <div class="card-title">USER PROFILE</div>
        <div class="profile-img-box">
          <img id="profilePreview" src="" alt="프로필">
          <div id="profilePlaceholder" style="font-size: 11px;">NO IMAGE</div>
        </div>
        <div style="font-weight: bold; font-size: 12px; margin-bottom: 6px;">User_01</div>
        <button type="button" class="profile-btn" onclick="document.getElementById('profileInput').click()">파일 선택</button>
        <input type="file" id="profileInput" accept="image/*" style="display: none;" onchange="loadProfileImageFromFile(event)">
      </div>

      <div class="card">
        <div class="card-title">MEMO PAD</div>
        <textarea id="memoInput" placeholder="메모를 입력하세요..." style="height: 80px; font-size: 11px;"></textarea>
      </div>
    </sidebar>
  </main>

  <footer>
    <p>Copyright (c) 2026 yourworldhelper. All rights reserved.</p>
  </footer>
</div>

<script>
  let currentMainTab = 'myWorld';
  let currentSubTab = 'world';

  const aiLevelDescriptions = {
    "1": "Lv.1 최소 (원문 내용 유지)",
    "2": "Lv.2 절제 (약간의 보완)",
    "3": "Lv.3 보통 (적절한 디테일 추가)",
    "4": "Lv.4 높음 (창의적 스토리 확장)",
    "5": "Lv.5 최대 (자율 구성)"
  };

  function changeTheme(themeName) {
    document.body.setAttribute('data-theme', themeName);
  }

  function updateAiLevelDesc(val) {
    document.getElementById('aiLevelDesc').innerText = aiLevelDescriptions[val];
  }

  function selectMainTab(tabType, element) {
    currentMainTab = tabType;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (element) element.classList.add('active');

    const subTabContainer = document.getElementById('subTabContainer');
    if (tabType === 'myWorld') {
      subTabContainer.style.display = 'flex';
    } else {
      subTabContainer.style.display = 'none';
      document.getElementById('genreGroup').style.display = 'none';
      document.getElementById('formTitle').innerText = element.innerText + ' 입력';
    }
  }

  function selectSubTab(subType, element) {
    currentSubTab = subType;
    document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
    if (element) element.classList.add('active');
    document.getElementById('genreGroup').style.display = subType === 'world' ? 'block' : 'none';
    document.getElementById('formTitle').innerText = subType === 'world' ? '세계관 설정 입력' : '캐릭터 설정 입력';
  }

  function loadProfileImageFromFile(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('profilePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('profilePlaceholder').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
  }

  async function generateContent() {
    const promptText = document.getElementById('promptInput').value.trim();
    const keywordText = document.getElementById('keywordInput').value.trim();
    const aiLevel = document.getElementById('aiLevelInput').value;
    const genre = document.getElementById('genreSelect').value;
    const outputDiv = document.getElementById('resultOutput');

    if (!promptText && !keywordText) {
      alert('상세 요구사항 또는 키워드 중 하나 이상을 입력해 주세요.');
      return;
    }

    outputDiv.innerHTML = '생성 중...';

    // 키워드가 빈칸일 때 맥락 자동 추론 명령어 구성
    let contextInstruction = "";
    if (!keywordText) {
      if (currentMainTab === 'dialogue') {
        contextInstruction = "[지침: 핵심 키워드가 비어 있으므로, 요구사항에 입력된 캐릭터 설정 및 말투에 맞춰 어울리는 상호작용 상황을 AI가 자율적으로 구성하여 대사를 출력하세요.]";
      } else {
        contextInstruction = "[지침: 핵심 키워드가 비어 있으므로, 선택된 장르와 요구사항 맥락에 적합한 관련 세계관 요소 및 스토리 아이디어를 AI가 자동으로 추론하여 구성하세요.]";
      }
    }

    const fullPrompt = `
[메인 카테고리: ${currentMainTab}]
[서브 카테고리: ${currentSubTab}]
[선택 장르: ${genre}]
[AI 관여도: Level ${aiLevel}]
[요구사항: ${promptText || '없음'}]
[핵심 키워드: ${keywordText || '자동 생성 (미입력)'}]
${contextInstruction}
    `.trim();

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: fullPrompt })
      });
      
      if (!response.ok) {
        throw new Error('서버 응답 오류');
      }

      const data = await response.json();
      outputDiv.innerHTML = data.result ? marked.parse(data.result) : '결과 데이터를 불러오지 못했습니다.';
    } catch (err) {
      outputDiv.innerHTML = '서버 통신 오류가 발생했거나 백엔드 API 엔드포인트(/api/generate)가 설정되지 않았습니다.';
    }
  }
</script>

</body>
</html>
